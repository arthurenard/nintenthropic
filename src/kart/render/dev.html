<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The site root, so the art files (assets/kart/*.glb) are found the way the game finds them. -->
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The site root, so the modelled art (assets/kart/*.glb) is found from here as it is from race.html. -->
    <base href="/" />
    <title>Grip Prix: Renderer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      }
      #stage {
        position: fixed;
        inset: 0;
      }
      #stage > canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #hud {
        position: absolute;
        inset: 0;
      }
      #dev {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: 10px;
        text-align: center;
        z-index: 5;
        padding: 6px 10px;
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.55);
        color: rgba(235, 235, 245, 0.85);
        font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
        font-variant-numeric: tabular-nums;
        pointer-events: none;
        white-space: pre;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #fff;
        font-size: 22px;
        font-weight: 600;
        background: #000;
        z-index: 10;
        transition: opacity 450ms;
      }
      #loading.done {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="canvas"></canvas><div id="hud"></div></div>
    <div id="dev"></div>
    <div id="loading">Getting ready…</div>
    <script type="module" src="/src/kart/render/dev.ts"></script>
  </body>
</html>
