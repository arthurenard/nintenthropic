<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The site root, so the renderer finds public/assets/kart/ (the Blender-made art) from this dev page too. -->
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Grip Prix: Landmark Gallery</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #label {
        position: fixed;
        left: 12px;
        top: 10px;
        padding: 5px 10px;
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.55);
        color: rgba(240, 240, 250, 0.92);
        font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        pointer-events: none;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="label"></div>
    <script type="module" src="/src/kart/render/gallery.ts"></script>
  </body>
</html>
