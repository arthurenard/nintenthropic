<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>High Noon · dev harness</title>
    <style>
      :root {
        --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", "Segoe UI", Roboto, system-ui, sans-serif;
        --glass: rgba(28, 28, 30, 0.72);
        --hair: rgba(255, 255, 255, 0.1);
        --label2: rgba(235, 235, 245, 0.62);
        --tint: #30d158;
        --danger: #ff453a;
        --gold: #ffd60a;
      }
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: var(--font); color: #fff; }
      canvas { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; cursor: none; }
      .num { font-variant-numeric: tabular-nums; }
      #hud { position: fixed; inset: 0; pointer-events: none; }
      .glass { background: var(--glass); backdrop-filter: saturate(180%) blur(24px); -webkit-backdrop-filter: saturate(180%) blur(24px); border: 1px solid var(--hair); }
      #panel { position: absolute; left: 24px; top: 24px; padding: 12px 16px 12px; border-radius: 16px; min-width: 132px; }
      #score { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; }
      .ro { display: flex; justify-content: space-between; gap: 18px; font-size: 13px; color: var(--label2); margin-top: 4px; }
      .ro b { color: #fff; font-weight: 600; }
      .ro.warning b { color: #ff9f0a; }
      #banner { position: absolute; left: 0; right: 0; top: 34%; text-align: center; opacity: 0; transform: translateY(12px); transition: opacity 450ms cubic-bezier(0.2, 0.9, 0.1, 1), transform 450ms cubic-bezier(0.2, 0.9, 0.1, 1); text-shadow: 0 2px 24px rgba(0,0,0,0.45); }
      #banner.on { opacity: 1; transform: none; }
      #banner .t { font-size: 56px; font-weight: 700; letter-spacing: -0.02em; }
      #banner .s { font-size: 17px; color: rgba(255,255,255,0.86); margin-top: 6px; }
      #ammo { position: absolute; right: 28px; bottom: 28px; width: 92px; height: 92px; border-radius: 46px; }
      #ammo i { position: absolute; width: 18px; height: 18px; border-radius: 9px; background: #e8e3d8; box-shadow: inset 0 -2px 0 rgba(0,0,0,0.25); transition: opacity 120ms; }
      #ammo i.spent { background: rgba(255,255,255,0.12); box-shadow: none; }
      #ammo.gold i { background: #f5c542; }
      #ammo.reloading { animation: spin 0.9s cubic-bezier(0.25, 0.1, 0.25, 1); }
      @keyframes spin { to { transform: rotate(360deg); } }
      #hint { position: absolute; left: 50%; bottom: 36px; transform: translateX(-50%); padding: 10px 18px; border-radius: 999px; font-size: 15px; opacity: 0; transition: opacity 250ms; white-space: nowrap; }
      #hint.on { opacity: 1; }
      #edge { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 62%, rgba(110,0,0,0.4) 100%); }
      #arc { position: absolute; left: 50%; top: 50%; width: 360px; height: 360px; margin: -180px 0 0 -180px; opacity: 0; transition: opacity 600ms; }
      #cross { position: fixed; width: 28px; height: 28px; margin: -14px 0 0 -14px; border-radius: 14px; border: 2px solid var(--tint); box-shadow: 0 0 0 1px rgba(0,0,0,0.35); pointer-events: none; }
      #cross::after { content: ""; position: absolute; left: 11px; top: 11px; width: 2px; height: 2px; border-radius: 1px; background: var(--tint); }
      .marker { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; animation: pop 320ms ease-out forwards; }
      .marker::before, .marker::after { content: ""; position: absolute; left: 12px; top: -2px; width: 2px; height: 30px; background: #fff; border-radius: 1px; }
      .marker::before { transform: rotate(45deg); } .marker::after { transform: rotate(-45deg); }
      .marker.headshot::before, .marker.headshot::after { background: var(--gold); }
      .marker.kill::before, .marker.kill::after { background: var(--danger); width: 3px; }
      @keyframes pop { 0% { transform: scale(1.25); opacity: 1; } 60% { transform: scale(1); opacity: 1; } 100% { transform: scale(1); opacity: 0; } }
      .popup { position: absolute; transform: translate(-50%, -50%); font-size: 17px; font-weight: 600; white-space: nowrap; text-shadow: 0 1px 8px rgba(0,0,0,0.6); animation: rise 900ms cubic-bezier(0.25, 0.1, 0.25, 1) forwards; }
      .popup.gold { color: var(--gold); } .popup.danger { color: var(--danger); }
      @keyframes rise { 0% { opacity: 0; margin-top: 6px; } 15% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; margin-top: -34px; } }
      #secret { position: absolute; left: 50%; top: 24px; transform: translate(-50%, -8px); padding: 10px 18px; border-radius: 16px; opacity: 0; transition: all 450ms cubic-bezier(0.2, 0.9, 0.1, 1); text-align: center; }
      #secret.on { opacity: 1; transform: translate(-50%, 0); }
      #secret .e { font-size: 12px; letter-spacing: 0.06em; font-weight: 600; color: var(--gold); text-transform: uppercase; }
      #secret .n { font-size: 17px; font-weight: 600; }
      #ring { position: absolute; border: 2px solid rgba(255,255,255,0.85); border-radius: 50%; display: none; box-shadow: 0 0 0 1px rgba(0,0,0,0.3); }
      #calib { position: absolute; left: 50%; top: 24px; transform: translateX(-50%); padding: 10px 18px; border-radius: 16px; font-size: 15px; display: none; }
      #results { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -46%); width: 380px; padding: 28px; border-radius: 28px; opacity: 0; transition: all 450ms cubic-bezier(0.2, 0.9, 0.1, 1); text-align: center; }
      #results.on { opacity: 1; transform: translate(-50%, -50%); }
      #results .o { font-size: 28px; font-weight: 600; }
      #results .sc { font-size: 56px; font-weight: 700; letter-spacing: -0.02em; margin: 6px 0 14px; }
      #results .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 8px; }
      #results .k { font-size: 13px; color: var(--label2); } #results .v { font-size: 22px; font-weight: 600; }
      #results .secrets { margin-top: 14px; font-size: 13px; color: var(--label2); }
      #load { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 17px; color: var(--label2); }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="hud">
      <div id="edge"></div>
      <svg id="arc" viewBox="-180 -180 360 360"><path d="M -60 -165 A 176 176 0 0 1 60 -165" stroke="#ff453a" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.9" /></svg>
      <div id="panel" class="glass"><div id="score" class="num">0</div><div id="readouts"></div></div>
      <div id="banner"><div class="t"></div><div class="s"></div></div>
      <div id="ammo" class="glass"></div>
      <div id="hint" class="glass"></div>
      <div id="secret" class="glass"><div class="e">Secret</div><div class="n"></div></div>
      <div id="ring"></div>
      <div id="calib" class="glass num"></div>
      <div id="results" class="glass"></div>
    </div>
    <div id="cross"></div>
    <div id="load">Getting ready…</div>
    <script type="module" src="./dev.ts"></script>
  </body>
</html>
