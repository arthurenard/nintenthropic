<!doctype html>
<!-- The tracker as the game runs it, served by the dev server only: a still
     picture of a hand played as a 30 fps video, read frame by frame by the
     tracker (?where=worker or ?where=page, ?delegate=CPU, ?hands=2, ?confidence=0.4, ?tiles=4, ?copies=4,
     ?players=3 for three players' fists (e2e/crowd.js), ?lanes=GPU,CPU,CPU for a worker per tile, ?adapt=1 for a
     slow worker to try the other delegate, and ?face=N to read the face too on every Nth frame, as a game that
     reads the eye does), while a busy animation loop measures what the tracking costs the page's frames. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <title>Tracker timing</title>
  </head>
  <body style="margin: 0; background: #000">
    <canvas id="frame" width="480" height="720"></canvas>
    <video id="video" muted playsinline></video>
    <script type="module">
      import { loadTracker } from "/src/tracking/tracker.ts";
      import { crowdPainter } from "/e2e/crowd.js";
      const params = new URLSearchParams(location.search);
      const report = (window.smoke = { error: null });
      try {
        const image = new Image();
        image.src = "/e2e/fixtures/hand.jpg";
        await image.decode();
        const canvas = document.getElementById("frame");
        // ?copies=N: the same hand N times in the picture (side by side, two rows from five), to see what a crowd of hands costs.
        const copies = Number(params.get("copies") ?? 1);
        if (copies > 1) {
          canvas.width = 1280;
          canvas.height = 720;
        }
        // ?players=N: N players holding two fists each, as big as they are in the game's camera (crowd.js).
        const crowd = params.has("players") ? crowdPainter(canvas, image, params) : null;
        const context = canvas.getContext("2d");
        const video = document.getElementById("video");
        video.srcObject = canvas.captureStream(30);
        let tick = 0;
        const paint = () => {
          if (crowd) crowd();
          else if (copies > 1) {
            const rows = copies > 4 ? 2 : 1;
            // ?slots=4 with ?copies=2: four seats' columns, hands in the first two (the others empty).
            const columns = Number(params.get("slots") ?? 0) || Math.ceil(copies / rows);
            const w = canvas.width / columns;
            const h = canvas.height / rows;
            const scale = Math.min(w / image.width, h / image.height);
            for (let i = 0; i < copies; i++) {
              const x = (i % columns) * w + (w - image.width * scale) / 2;
              const y = Math.floor(i / columns) * h + (h - image.height * scale) / 2;
              context.drawImage(image, x, y, image.width * scale, image.height * scale);
            }
          } else context.drawImage(image, 0, 0, 480, 720);
          context.fillStyle = tick++ % 2 ? "#000" : "#010101";
          context.fillRect(0, 0, 1, 1);
        };
        paint();
        await video.play();
        const tracker = await loadTracker(
          { wasm: () => {}, model: () => {} },
          {
            where: params.get("where") ?? "auto",
            prefer: params.get("delegate") === "CPU" ? "CPU" : "GPU",
            hands: Number(params.get("hands") ?? 1),
            confidence: params.has("confidence") ? Number(params.get("confidence")) : undefined,
            tiles: params.has("tiles") ? Number(params.get("tiles")) : undefined,
            // ?lanes=GPU,CPU,CPU: each tile in a worker of its own, on these delegates.
            lanes: params.has("lanes") ? params.get("lanes").split(",") : undefined,
            // ?adapt=1: a slow worker tries the other delegate (adapt.ts), as Grip Prix asks.
            adapt: params.get("adapt") === "1",
            face: Number(params.get("face") ?? 0) > 0,
          },
        );
        tracker.readFace(Number(params.get("face") ?? 0));
        if (params.get("carrier") === "bitmap") tracker.carrier = "bitmap";
        report.where = tracker.where;
        report.delegate = tracker.delegates?.join("+") ?? tracker.delegate;
        // Lanes publish a frame per column read: reads a second are counted per column.
        report.columns = tracker.delegates?.length ?? 1;
        let hands = 0;
        let total = 0;
        let counted = 0;
        tracker.subscribe((frame) => {
          hands += frame.landmarks ? 1 : 0;
          total += frame.hands.length;
          report.handsPerFrame = total / ++counted;
        });
        let faces = 0;
        tracker.subscribeFace((face) => (faces += face.eyes ? 1 : 0));
        tracker.start(video);
        // Let the first frames compile their shaders, then measure.
        await new Promise((resolve) => setTimeout(resolve, 3000));
        tracker.resetStats();
        const intervals = [];
        let last = performance.now();
        await new Promise((resolve) => {
          const frame = (now) => {
            intervals.push(now - last);
            last = now;
            paint();
            if (intervals.length < 300) requestAnimationFrame(frame);
            else resolve();
          };
          requestAnimationFrame(frame);
        });
        const sorted = [...intervals].sort((a, b) => a - b);
        report.frames = { p50: sorted[150], p95: sorted[285], max: sorted[299], over20: intervals.filter((v) => v > 20).length };
        report.seconds = intervals.reduce((sum, v) => sum + v, 0) / 1000;
        report.tracker = tracker.stats();
        report.fps = report.tracker.frames / report.seconds;
        report.hands = hands;
        report.faces = faces;
        tracker.dispose();
      } catch (error) {
        report.error = String(error?.stack || error);
      }
      report.done = true;
    </script>
  </body>
</html>
